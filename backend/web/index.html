<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAPI-Switch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='4' width='14' height='8' rx='1.5' fill='%232563eb'/%3E%3Crect x='3' y='7' width='2' height='2' fill='white'/%3E%3Crect x='7' y='7' width='2' height='2' fill='white'/%3E%3Crect x='11' y='7' width='2' height='2' fill='white'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel2: #f9fafb; --text: #1b1f24; --muted: #646d78;
  --line: #dde1e6; --accent: #2563eb; --accent-text: #ffffff; --ok: #16a34a; --warn: #d97706;
  --bad: #dc2626; --off: #9aa3ad; --chip: #eef1f4; --shadow: 0 1px 2px rgba(0,0,0,.06);
  --dirty: #fff7e0; --dirty-line: #f0c050;
  --chassis: #2b3038; --chassis-text: #e8ebef; --chassis-muted: #a6aeb8; --chassis-hover: #3a414b; --wan: #4ea1ff; --wan-bg: rgba(78,161,255,.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #1a1e24; --panel2: #20252c; --text: #e6e9ed; --muted: #98a1ab;
    --line: #2e343c; --accent: #4f8cff; --accent-text: #0b0e12; --ok: #3fbf6a; --warn: #f0a33a;
    --bad: #f05252; --off: #5d6670; --chip: #262c34; --shadow: none; --dirty: #3a3018; --dirty-line: #8a6d1e;
    --chassis: #0c0f13; --chassis-text: #e6e9ed; --chassis-muted: #98a1ab; --chassis-hover: #1c222a; --wan: #58a6ff; --wan-bg: rgba(88,166,255,.10);
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #1a1e24; --panel2: #20252c; --text: #e6e9ed; --muted: #98a1ab;
  --line: #2e343c; --accent: #4f8cff; --accent-text: #0b0e12; --ok: #3fbf6a; --warn: #f0a33a;
  --bad: #f05252; --off: #5d6670; --chip: #262c34; --shadow: none; --dirty: #3a3018; --dirty-line: #8a6d1e;
    --chassis: #0c0f13; --chassis-text: #e6e9ed; --chassis-muted: #98a1ab; --chassis-hover: #1c222a; --wan: #58a6ff; --wan-bg: rgba(88,166,255,.10);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
header { background: var(--panel); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; align-items: center; gap: 16px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
.brand { font-weight: 650; font-size: 16px; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.hstat { display: flex; gap: 14px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.hstat b { color: var(--text); font-weight: 550; }
.spacer { flex: 1; }
nav { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
nav .wrap { display: flex; gap: 2px; overflow-x: auto; }
nav button { background: none; border: 0; padding: 10px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
nav button.on { color: var(--text); border-bottom-color: var(--accent); }
main { padding: 16px 0 120px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); margin-bottom: 16px; }
.card > h2 { margin: 0; font-size: 14px; font-weight: 650; padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.card > h2 .spacer { flex: 1; }
.card .body { padding: 14px; }
.note { color: var(--muted); font-size: 13px; }
.warnbox { background: var(--dirty); border: 1px solid var(--dirty-line); border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--panel2); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
input[type=text], input[type=number], input[type=password], select {
  background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 4px 7px; min-height: 30px; }
input[type=number] { width: 84px; }
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input:disabled, select:disabled { opacity: .5; }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; min-height: 30px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.sm { padding: 2px 8px; min-height: 26px; font-size: 13px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--off); margin-right: 6px; vertical-align: 0; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; background: var(--chip); font-size: 12px; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
.sw { position: relative; display: inline-block; width: 34px; height: 20px; vertical-align: middle; }
.sw input { opacity: 0; width: 0; height: 0; position: absolute; }
.sw span { position: absolute; inset: 0; background: var(--off); border-radius: 10px; cursor: pointer; transition: background .15s; }
.sw span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: transform .15s; }
.sw input:checked + span { background: var(--ok); }
.sw input:checked + span::after { transform: translateX(14px); }
.sw input:disabled + span { opacity: .4; cursor: default; }
.sw input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
.form { display: grid; grid-template-columns: max-content 1fr; gap: 10px 16px; align-items: center; }
.form label { color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
.kv div:nth-child(odd) { color: var(--muted); }
.panel-front { display: flex; gap: 10px; flex-wrap: wrap; padding: 14px; }
.chassis { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start; padding: 14px; background: var(--chassis); border-radius: 0 0 8px 8px; }
.chassis .gap { width: 14px; }
/* WAN is the SoC's own NIC, not a switch port: separate blue block */
.panels { display: flex; gap: 16px; flex-wrap: wrap; align-items: stretch; }
.panels > .card:first-child { flex: 1 1 auto; }
.panels > .card { display: flex; flex-direction: column; }
.panels > .card > .chassis { flex: 1; }
.chassis .wanblk { display: flex; flex-direction: column; align-items: center; padding: 2px 6px 4px; border: 2px solid var(--wan); border-radius: 8px; background: var(--wan-bg); }
.chassis .wanblk .tag { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--wan); }
.jack.wan { width: auto; min-width: 150px; }
.jack.wan .sub { max-width: none; white-space: normal; overflow: visible; }
.jack.wan .sub.ip { color: var(--chassis-text); font-family: ui-monospace, monospace; font-size: 12px; }
.jack.wan .sub.mac { font-family: ui-monospace, monospace; }
.jack { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 1px solid transparent; cursor: pointer; padding: 6px 4px 4px; border-radius: 8px; color: var(--chassis-text); width: 92px; }
.jack:hover { background: var(--chassis-hover); }
.jack:focus-visible { outline: 2px solid var(--accent); }
.jack svg { width: 60px; height: 54px; display: block; }
.jack.off svg { opacity: .45; }
.jack .lbl { font-weight: 650; font-size: 13px; }
.jack .sub { font-size: 11px; color: var(--chassis-muted); max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 15px; }
.jack .sub.warn { color: var(--warn); }
.legend { display: flex; gap: 14px; padding: 8px 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.led { display: inline-block; width: 10px; height: 6px; border-radius: 1px; margin-right: 5px; vertical-align: 1px; }
.pd-sec { margin-top: 14px; }
.pd-sec:first-child { margin-top: 0; }
.pd-sec h3 { font-size: 13px; margin: 0 0 8px; font-weight: 650; }
.vtags { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.ptabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: -14px -14px 14px; padding: 0 8px; }
.ptabs button { background: none; border: 0; padding: 9px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.ptabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.pt { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 112px; background: var(--panel2); cursor: pointer; }
.pt:hover { border-color: var(--muted); }
.pt .n { font-weight: 650; display: flex; align-items: center; }
.pt .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
.pt .d { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
.cell-sel { min-width: 64px; }
.cell-u { background: color-mix(in srgb, var(--ok) 18%, transparent); }
.cell-t { background: color-mix(in srgb, var(--accent) 16%, transparent); }
td.dirty, .dirty-mark { box-shadow: inset 3px 0 0 var(--dirty-line); }
#bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: none; }
#bar .wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
#bar.show { display: block; }
#bar.draft { background: var(--panel); border-top: 2px solid var(--dirty-line); box-shadow: 0 -4px 14px rgba(0,0,0,.12); }
#bar.pending { background: var(--dirty); border-top: 2px solid var(--warn); box-shadow: 0 -4px 14px rgba(0,0,0,.12); }
#bar .big { font-weight: 650; }
#toasts { position: fixed; right: 16px; top: 16px; z-index: 40; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: 10px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.15); white-space: pre-wrap; word-break: break-word; }
.toast.bad { border-left-color: var(--bad); } .toast.ok { border-left-color: var(--ok); }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 64px); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog .dh { display: flex; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 650; }
dialog .db { padding: 14px; overflow: auto; max-height: calc(100vh - 180px); }
dialog .df { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
pre.cmds { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin: 0; overflow-x: auto; font-size: 12.5px; }
#login { max-width: 420px; margin: 12vh auto; padding: 0 16px; }
#login .card .body { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hidden { display: none !important; }
@media (max-width: 640px) {
  .form { grid-template-columns: 1fr; gap: 4px 0; }
  .form label { margin-top: 6px; }
  .hstat { display: none; }
}
</style>
</head>
<body>
<div id="login" class="hidden">
  <div class="card">
    <h2>NAPI-Switch: вход</h2>
    <div class="body">
      <div class="note">Токен API лежит на устройстве в <span class="mono">/etc/napi-switch/token</span>.</div>
      <input id="tok" type="password" placeholder="Токен" autocomplete="current-password">
      <div class="row"><button class="btn primary" id="tokgo">Войти</button><span id="tokerr" class="note"></span></div>
    </div>
  </div>
</div>

<div id="app" class="hidden">
<header><div class="wrap">
  <div class="brand" id="h-name">NAPI-Switch<small></small></div>
  <div class="hstat" id="h-stat"></div>
  <div class="spacer"></div>
  <span id="h-saved"></span>
  <button class="btn sm" id="h-save" title="Записать применённую конфигурацию, чтобы она действовала после перезагрузки">Сохранить</button>
  <button class="btn sm" id="h-out">Выйти</button>
</div></header>
<nav><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap" id="view"></div></main>
</div>

<div id="bar"><div class="wrap" id="barin"></div></div>
<div id="toasts"></div>
<dialog id="dlg"><div class="dh"><span id="dlg-t"></span><span class="spacer"></span><button class="btn sm" data-close>✕</button></div><div class="db" id="dlg-b"></div><div class="df" id="dlg-f"></div></dialog>

<script>
"use strict";
const API = "/api/v1";
const TABS = [
  ["ports", "Порты"], ["vlan", "VLAN"], ["net", "Сеть"], ["stp", "STP / MRP"], ["fdb", "MAC-таблица"],
  ["mcast", "Мультикаст"], ["mirror", "Зеркалирование"], ["system", "Система"], ["log", "Журнал"],
];
const SPEED_LABEL = { auto: "Авто", "1000full": "1000 полный", "100full": "100 полный", "100half": "100 полу", "10full": "10 полный", "10half": "10 полу" };
const STP_LABEL = { forwarding: ["ok", "пересылка"], blocking: ["warn", "блокировка"], listening: ["warn", "прослушивание"], learning: ["warn", "обучение"], disabled: ["", "выключен"] };

const S = { token: "", caps: null, sys: null, ports: [], view: null, draft: null, tab: "ports", offset: 0, stp: null, mrp: null, fdb: null, mcast: null, events: [], counters: null, applyConfirm: 60, applySave: true, fdbFilter: { port: "", vlan: "", type: "" } };

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = (x) => JSON.parse(JSON.stringify(x));
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
};
function toast(msg, kind = "") {
  const t = document.createElement("div");
  t.className = "toast " + kind;
  t.textContent = msg;
  $("#toasts").append(t);
  setTimeout(() => t.remove(), kind === "bad" ? 9000 : 4000);
}
function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? d + " д " : "") + h + " ч " + m + " мин";
}
function fmtNum(n) { return (n ?? 0).toLocaleString("ru-RU"); }
function fmtBytes(n) {
  n = n || 0;
  const u = ["Б", "КБ", "МБ", "ГБ", "ТБ"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : n) + " " + u[i];
}
const sw = (attrs, on, disabled) => `<label class="sw"><input type="checkbox" ${attrs} ${on ? "checked" : ""} ${disabled ? "disabled" : ""}><span></span></label>`;

class HTTPError extends Error {
  constructor(status, data) { super(data?.error || ("HTTP " + status)); this.status = status; this.data = data || {}; }
}
async function api(method, path, body) {
  const opt = { method, headers: { Authorization: "Bearer " + S.token } };
  if (body !== undefined) { opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  const r = await fetch(API + path, opt);
  const date = r.headers.get("Date");
  if (date) S.offset = new Date(date).getTime() - Date.now();
  let data = null;
  try { data = await r.json(); } catch {}
  if (r.status === 401) { showLogin("Токен не подошёл"); throw new HTTPError(401, data); }
  if (!r.ok) throw new HTTPError(r.status, data);
  return data;
}
function showErr(e) {
  if (!(e instanceof HTTPError)) { toast("Нет связи с устройством: " + e.message, "bad"); return; }
  const d = e.data;
  if (d.problems) {
    openDialog("Конфигурация не прошла проверку", `<ul>${d.problems.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>`);
  } else if (d.apply_error) {
    const a = d.apply_error;
    openDialog("Ошибка применения", `<p>Команда завершилась ошибкой${a.restored ? ", предыдущая конфигурация восстановлена" : ""}.</p><pre class="cmds">${esc(a.command)}\n${esc(a.error)}</pre>`);
  } else toast(d.error || e.message, "bad");
}

// ---------- dialog ----------
function openDialog(title, html, buttons = []) {
  const dl = $("#dlg");
  $("#dlg-t").textContent = title;
  $("#dlg-b").innerHTML = html;
  const f = $("#dlg-f"); f.innerHTML = "";
  for (const [label, cls, fn] of [...buttons, ["Закрыть", "", null]]) {
    const b = document.createElement("button");
    b.className = "btn " + cls; b.textContent = label;
    b.onclick = async () => { if (fn) { if (await fn() === false) return; } dl.close(); };
    f.append(b);
  }
  if (!dl.open) dl.showModal();
}
$("#dlg").addEventListener("click", (e) => { if (e.target.closest("[data-close]") || e.target === $("#dlg")) $("#dlg").close(); });
$("#dlg").addEventListener("close", () => { S.counters = null; S.portDlg = null; });

// ---------- login ----------
function showLogin(msg) {
  $("#app").classList.add("hidden"); $("#bar").classList.remove("show");
  $("#login").classList.remove("hidden"); $("#tokerr").textContent = msg || "";
  $("#tok").focus();
}
async function tryLogin(tok) {
  S.token = tok;
  try { await api("GET", "/system"); } catch (e) { if (!(e instanceof HTTPError) || e.status !== 401) $("#tokerr").textContent = "Нет связи с устройством"; return false; }
  store.set("napi-token", tok);
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  await boot();
  return true;
}
$("#tokgo").onclick = () => tryLogin($("#tok").value.trim());
$("#tok").addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin($("#tok").value.trim()); });
$("#h-out").onclick = () => { store.set("napi-token", ""); S.token = ""; showLogin(); };

// ---------- data ----------
const applied = () => S.view?.applied;
const dirty = () => S.draft && applied() && JSON.stringify(S.draft) !== JSON.stringify(applied());
const portView = (n) => S.ports.find((p) => p.name === n);
const portNames = () => Object.keys(S.draft?.ports || {}).sort();
const bridgedNames = () => portNames().filter((n) => portView(n)?.bridged);

async function loadView() {
  const wasDirty = dirty();
  S.view = await api("GET", "/config");
  if (!S.draft || !wasDirty) S.draft = clone(S.view.applied);
}
async function loadStatus() {
  const [sys, ports] = await Promise.all([api("GET", "/system"), api("GET", "/ports")]);
  S.sys = sys; S.ports = ports;
}
async function loadTabData() {
  if (S.tab === "stp") [S.stp, S.mrp] = await Promise.all([api("GET", "/stp"), api("GET", "/mrp")]);
  if (S.tab === "fdb") {
    const q = new URLSearchParams(Object.entries(S.fdbFilter).filter(([, v]) => v)).toString();
    S.fdb = await api("GET", "/fdb" + (q ? "?" + q : ""));
  }
  if (S.tab === "mcast") S.mcast = await api("GET", "/multicast");
  if (S.tab === "log") S.events = await api("GET", "/events");
  if (S.tab === "net" || S.tab === "ports") S.net = await api("GET", "/network");
}
async function boot() {
  try {
    S.caps = await api("GET", "/capabilities");
    await Promise.all([loadView(), loadStatus()]);
    await loadTabData();
  } catch (e) { showErr(e); }
  renderTabs(); render(); renderHeader(); renderBar();
}
let polling = false;
async function poll() {
  if (polling || !S.token || $("#app").classList.contains("hidden")) return;
  polling = true;
  try {
    const before = JSON.stringify(applied());
    await Promise.all([loadView(), loadStatus(), loadTabData()]);
    renderHeader(); renderBar();
    if (JSON.stringify(applied()) !== before && !dirty()) render(); else updateLive();
  } catch (e) { if (!(e instanceof HTTPError)) { $("#h-saved").innerHTML = `<span class="chip bad">нет связи</span>`; } }
  polling = false;
}
setInterval(poll, 4000);

// ---------- header / tabs ----------
function renderHeader() {
  const s = S.sys; if (!s) return;
  $("#h-name").innerHTML = `${esc(s.name || s.hostname)}<small>${esc(s.model)}</small>`;
  const t = s.temperatures_c?.length ? Math.max(...s.temperatures_c).toFixed(0) + " °C" : "—";
  const cpu = s.cpu_port || {};
  const crc = (cpu.rx_crc_errors || 0) + (cpu.switch_rx_crc_errors || 0);
  const up = S.ports.filter((p) => p.link?.up).length;

// Highlight inputs whose value differs from the applied config.
function markDirty() {

}
function setPath(path, val) {
  const p = path.split("."); let o = S.draft;

// Generic binding: inputs with data-path edit the draft.
function takeNet() {
  if (!S.draft.network && S.net) S.draft.network = clone(S.net.suggested);

}
function bindInput(e) {
  const el = e.target; if (!el.dataset.path) return;

    : el.dataset.type === "list" ? el.value.split(/[\s,;]+/).filter(Boolean) : el.value;
  setPath(el.dataset.path, v);

const LED_LINK = "#22c55e", LED_SPEED = "#f59e0b", LED_OFF = "#4a5059";

      <rect x="25" y="46" width="10" height="5" rx="1" fill="${g}"/></svg>`;
  }

// "1 Гбит/с", "100 Мбит/с"; half duplex is rare enough to spell out.
function speedText(speed, duplex) {

  </div></div></div>

$("#view").addEventListener("change", (e) => {
  const el = e.target; if (!el.dataset.vcell) return;
  const p = S.draft.ports[el.dataset.vcell], vid = +el.dataset.vid;
  p.tagged = p.tagged.filter((x) => x !== vid);
  if (p.pvid === vid) p.pvid = 0;
  if (el.value === "u") p.pvid = vid;
  if (el.value === "t") p.tagged = [...p.tagged, vid].sort((a, b) => a - b);

});
$("#view").addEventListener("click", (e) => {
  if (e.target.id === "v-add") {
    const id = parseInt($("#v-id").value, 10), name = $("#v-name").value.trim();
    if (!(id >= 1 && id <= 4094)) { toast("VID должен быть от 1 до 4094", "bad"); return; }
    if (S.draft.vlans.some((v) => v.id === id)) { toast(`VLAN ${id} уже есть`, "bad"); return; }
    S.draft.vlans.push({ id, name }); S.draft.vlans.sort((a, b) => a.id - b.id);
    render(); changed();
  }
  const d = e.target.closest("[data-vdel]");

    S.draft.static_fdb = S.draft.static_fdb.filter((f) => f.vlan !== id);
    render(); changed();
  }
});

const MRP_STATE = {
  CHK_RC: ["ok", "кольцо замкнуто, запасной порт заблокирован"], CHK_RO: ["warn", "кольцо разомкнуто, оба порта передают"],
  PRM_UP: ["warn", "линк только на одном порту кольца"], AC_STAT1: ["bad", "нет линка на портах кольца"],
  PT_IDLE: ["ok", "в кольце, оба порта передают"], PT: ["warn", "линк поднимается"], DE: ["warn", "линк падает"], DE_IDLE: ["warn", "линк только на одном порту"],

    <div>Запасной порт сейчас</div><div>${esc(r.secondary)}</div>
    <div>Профиль</div><div>${r.profile} мс</div></div>`;
}
function viewMRP() {
  const r = S.draft.mrp, on = !!r, names = bridgedNames();

  const ports = names.map((n) => [n, n]);

    <label>MRP</label><div>${sw(`id="mrp-on"`, on, S.mrp && !S.mrp.available && !on)} <span class="note">кольцевое резервирование вместо STP</span></div>
    <label>Роль</label><div><select data-path="mrp.role" ${on ? "" : "disabled"}>${opts(r?.role, [["mrm", "менеджер (MRM)"], ["mrc", "клиент (MRC)"]])}</select></div>
    <label>Номер кольца</label><div><input type="number" min="1" max="65535" data-type="int" data-path="mrp.ring_id" value="${r?.ring_id ?? 1}" ${on ? "" : "disabled"}></div>

$("#view").addEventListener("change", (e) => {

  const i = S.draft.bridge.igmp;
  return `<div class="card"><h2>IGMP</h2><div class="body"><div class="form">
    <label>IGMP snooping</label><div class="fld" data-path="bridge.igmp.snooping">${sw(`data-path="bridge.igmp.snooping"`, i.snooping)} <span class="note">мультикаст уходит только на порты, где есть подписчики</span></div>
    <label>Querier</label><div class="fld" data-path="bridge.igmp.querier">${sw(`data-path="bridge.igmp.querier"`, i.querier)} <span class="note">включайте, если в сети нет маршрутизатора с IGMP</span></div>
  </div></div></div>
  <div class="card"><h2>Группы</h2><div class="scroll" id="mc-live">${mcastLive()}</div></div>`;
}

// ---------- mirror ----------
function viewMirror() {
  const m = S.draft.mirror, names = bridgedNames();
  const on = !!m;
  const dirOf = (n) => m?.sources.find((s) => s.port === n)?.direction || "";
  const rows = names.filter((n) => !on || n !== m.dest).map((n) => `<tr><td>${esc(n)}</td><td><select data-msrc="${esc(n)}" ${on ? "" : "disabled"}>
      ${[["", "—"], ["rx", "приём"], ["tx", "передача"], ["both", "приём и передача"]].map(([v, l]) => `<option value="${v}" ${dirOf(n) === v ? "selected" : ""}>${l}</option>`).join("")}</select></td></tr>`).join("");
  return `<div class="card"><h2>Зеркалирование портов</h2><div class="body"><div class="form">
    <label>Зеркалирование</label><div>${sw(`id="m-on"`, on)} <span class="note">одна сессия, копирует сам чип, процессор не нагружается</span></div>
    <label>Порт анализатора</label><div><select id="m-dest" ${on ? "" : "disabled"}>${names.map((n) => `<option ${m?.dest === n ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>
  </div></div>
  <table><thead><tr><th>Источник</th><th>Что копировать</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
$("#view").addEventListener("change", (e) => {
  const el = e.target, names = bridgedNames();
  if (el.id === "m-on") {
    S.draft.mirror = el.checked ? { dest: names.at(-1), sources: [] } : null;
    render(); changed();
  } else if (el.id === "m-dest") {
    S.draft.mirror.dest = el.value;
    S.draft.mirror.sources = S.draft.mirror.sources.filter((s) => s.port !== el.value);
    render(); changed();
  } else if (el.dataset.msrc) {
    const m = S.draft.mirror, n = el.dataset.msrc;
    m.sources = m.sources.filter((s) => s.port !== n);
    if (el.value) m.sources.push({ port: n, direction: el.value });
    m.sources.sort((a, b) => a.port.localeCompare(b.port));
    changed();
  }
});

// ---------- network (WAN / LAN / router) ----------
function cidrInfo(s) {
  const m = /^(\d+)\.(\d+)\.(\d+)\.(\d+)\/(\d+)$/.exec(s || ""); if (!m) return null;
  const ip = ((+m[1] << 24) | (+m[2] << 16) | (+m[3] << 8) | +m[4]) >>> 0, bits = +m[5];
  if (bits < 8 || bits > 30) return null;
  const mask = bits ? (0xffffffff << (32 - bits)) >>> 0 : 0;
  return { ip, bits, base: (ip & mask) >>> 0, hosts: 2 ** (32 - bits) - 2 };
}
const ipStr = (n) => [n >>> 24, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join(".");
const ipNum = (s) => { const m = /^(\d+)\.(\d+)\.(\d+)\.(\d+)$/.exec(s || ""); return m && m.slice(1).every((x) => +x <= 255) ? ((+m[1] << 24) | (+m[2] << 16) | (+m[3] << 8) | +m[4]) >>> 0 : null; };
function poolNote() {
  const l = (S.draft.network || S.net?.suggested)?.lan, ci = cidrInfo(l?.address); if (!ci) return "";
  const d = l.dhcp_server, pLo = ipNum(d.pool_start), pHi = ipNum(d.pool_end);
  return pLo === null || pHi === null ? "неверный адрес"
    : pLo < ci.base + 1 || pHi > ci.base + ci.hosts ? `вне подсети ${ipStr(ci.base + 1)} – ${ipStr(ci.base + ci.hosts)}`
    : pHi < pLo ? "конец раньше начала"
    : ci.ip >= pLo && ci.ip <= pHi ? `содержит адрес роутера ${ipStr(ci.ip)}`
    : `всего ${pHi - pLo + 1}`;
}
// When the LAN subnet changes, carry the DHCP pool over at the same offsets.
function movePool(oldCidr, newCidr) {
  const d = S.draft.network?.lan?.dhcp_server, a = cidrInfo(oldCidr), b = cidrInfo(newCidr);
  if (!d || !a || !b || a.base === b.base) return;
  const lo = ipNum(d.pool_start), hi = ipNum(d.pool_end);
  if (lo === null || hi === null || lo < a.base || hi > a.base + a.hosts) return;
  d.pool_start = ipStr(b.base + Math.min(lo - a.base, b.hosts));
  d.pool_end = ipStr(b.base + Math.min(hi - a.base, b.hosts));
}
const ifStatus = (name) => (S.net?.interfaces || []).find((i) => i.name === name);
function ifLive(name) {
  const s = ifStatus(name);
  if (!s) return `<span class="note">нет данных</span>`;
  const st = s.state === "routable" ? "ok" : s.state === "no-carrier" || s.state === "off" ? "bad" : "warn";
  return `<div class="kv">
    <div>Состояние</div><div><span class="dot ${st}"></span>${esc(s.state || "—")}</div>
    <div>Адреса</div><div class="mono">${s.addresses.map(esc).join(", ") || "—"}${s.dhcp ? ` <span class="chip">DHCP</span>` : ""}</div>
    <div>Шлюз</div><div class="mono">${esc(s.gateway || "—")}</div>
    <div>DNS</div><div class="mono">${s.dns.map(esc).join(", ") || "—"}</div>
    <div>MAC</div><div class="mono">${esc(s.mac)}</div>
    <div>Файл networkd</div><div class="mono note" style="white-space:normal">${esc(s.network_file || "—")}</div></div>`;
}
function leasesLive() {
  const l = S.net?.dhcp_leases || [];
  if (!l.length) return `<p class="note" style="padding:0 14px 14px">Активных аренд нет.</p>`;
  return `<table><thead><tr><th>Адрес</th><th>MAC</th><th>Имя</th><th>До</th></tr></thead><tbody>${l.map((x) => `<tr><td class="mono">${esc(x.address)}</td><td class="mono">${esc(x.mac)}</td><td>${esc(x.hostname || "—")}</td><td class="note">${x.expires ? new Date(x.expires * 1000).toLocaleString("ru-RU") : "—"}</td></tr>`).join("")}</tbody></table>`;
}
const inp = (path, val, ph = "", w = 170, extra = "") => `<input type="text" data-path="${path}" value="${esc(val)}" placeholder="${esc(ph)}" style="width:${w}px" ${extra}>`;
const listInp = (path, val, ph) => `<input type="text" data-path="${path}" data-type="list" value="${esc((val || []).join(", "))}" placeholder="${esc(ph)}" style="width:240px">`;
function viewNet() {
  let n = S.draft.network; const net = S.net;
  if (!net) return `<p class="note">Загрузка…</p>`;
  // Not managed yet: show the suggested config (same as netplan) so every
  // option is visible; the first edit copies it into the draft (takeNet).
  const shadow = !n;
  if (shadow) n = net.suggested;
  const r = n.mode === "router", w = n.wan, l = n.lan, d = l.dhcp_server, f = n.firewall;
  const ci = cidrInfo(l.address);

  const nft = net.nft_available;
  const modeBtn = (m, t, s) => `<label class="pt" style="cursor:pointer;min-width:220px;${n.mode === m ? "border-color:var(--accent)" : ""}"><div class="n"><input type="radio" name="n-mode" data-path="network.mode" data-rerender="1" value="${m}" ${n.mode === m ? "checked" : ""}> ${t}</div><div class="s">${s}</div></label>`;
  let h = shadow ? `<div class="warnbox" style="margin-bottom:12px">Сейчас адресами управляет netplan (WAN и br0 по DHCP). Ниже — те же настройки; первое изменение передаст управление сетью демону. На плате ничего не меняется до «Применить».</div>` : "";
  h += `<div class="card"><h2>Режим</h2><div class="panel-front">
    ${modeBtn("switch", "Коммутатор", "br0 — обычный клиент сети: адрес по DHCP или статический")}
    ${modeBtn("router", "Роутер", "порты lan1–lan5 — локальная сеть за NAT, WAN — выход наружу")}</div>
    ${r ? `<div class="body" style="padding-top:0"><div class="warnbox">В режиме роутера на портах lan1–lan5 работает DHCP-сервер. Убедитесь, что к ним не подключена другая сеть, иначе устройства этой сети начнут получать адреса от коммутатора. Управление остаётся доступным с WAN (${esc(ifStatus(w.interface)?.addresses?.[0] || w.interface)}) и из LAN (${esc(l.address)}).</div></div>` : ""}</div>`;
  h += `<div class="grid2"><div class="card"><h2>WAN</h2><div class="body"><div class="form">
    <label>Интерфейс</label><div><select data-path="network.wan.interface" data-rerender="1">${net.wan_candidates.map((x) => `<option ${x === w.interface ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
    <label>Адрес</label><div><select data-path="network.wan.proto" data-rerender="1"><option value="dhcp" ${w.proto === "dhcp" ? "selected" : ""}>DHCP</option><option value="static" ${w.proto === "static" ? "selected" : ""}>статический</option></select></div>
    ${w.proto === "static" ? `<label>IP/маска</label><div>${inp("network.wan.address", w.address, "192.0.2.10/24")}</div><label>Шлюз</label><div>${inp("network.wan.gateway", w.gateway, "192.0.2.1")}</div>` : ""}
    <label>DNS</label><div>${listInp("network.wan.dns", w.dns, w.proto === "dhcp" ? "из DHCP" : "8.8.8.8, 1.1.1.1")}</div>
  </div></div><div class="body" style="border-top:1px solid var(--line)" id="n-wan-live">${ifLive(w.interface)}</div></div>`;
  h += `<div class="card"><h2>LAN (мост br0)</h2><div class="body"><div class="form">
    ${r ? `<label>IP роутера/маска</label><div>${inp("network.lan.address", l.address, "192.168.1.1/24", 170, 'data-rerender="1"')}</div>`
      : `<label>Адрес</label><div><select data-path="network.lan.proto" data-rerender="1"><option value="dhcp" ${l.proto === "dhcp" ? "selected" : ""}>DHCP</option><option value="static" ${l.proto === "static" ? "selected" : ""}>статический</option></select></div>
         ${l.proto === "static" ? `<label>IP/маска</label><div>${inp("network.lan.address", l.address, "192.168.30.81/24")}</div><label>Шлюз</label><div>${inp("network.lan.gateway", l.gateway, "необязательно")}</div>` : ""}
         <label>DNS</label><div>${listInp("network.lan.dns", l.dns, l.proto === "dhcp" ? "из DHCP" : "8.8.8.8")}</div>`}
  </div></div><div class="body" style="border-top:1px solid var(--line)" id="n-lan-live">${ifLive("br0")}</div></div></div>`;
  // Router-only settings stay visible in switch mode, dimmed: they are kept
  // in the config and take effect once the mode is switched to router.
  if (!r) h += `<div class="note" style="margin:4px 0 8px">Настройки ниже действуют только в режиме «Роутер». Их можно заполнить заранее.</div><div style="opacity:.6">`;
  h += `<div class="card"><h2>DHCP-сервер LAN<span class="spacer"></span>${sw(`data-path="network.lan.dhcp_server.enabled" data-rerender="1"`, d.enabled)}</h2>
    ${d.enabled ? `<div class="body"><div class="form">
      <label>Диапазон адресов</label><div class="row">с ${inp("network.lan.dhcp_server.pool_start", d.pool_start, ci ? ipStr(ci.base + 100) : "192.168.1.100", 140, 'class="mono"')} по ${inp("network.lan.dhcp_server.pool_end", d.pool_end, ci ? ipStr(ci.base + 199) : "192.168.1.199", 140, 'class="mono"')} <span class="note" id="pool-note">${esc(poolNote())}</span></div>
      <label>Срок аренды, с</label><div><input type="number" min="60" data-type="int" data-path="network.lan.dhcp_server.lease_time" value="${d.lease_time}"> <span class="note">${Math.round(d.lease_time / 360) / 10} ч</span></div>
      <label>DNS для клиентов</label><div>${listInp("network.lan.dhcp_server.dns", d.dns, "как у WAN")}</div></div></div>
      <div class="body" style="border-top:1px solid var(--line);padding-bottom:6px"><b>Закреплённые адреса</b></div>
      ${d.static_leases.length ? `<div class="scroll"><table><thead><tr><th>MAC</th><th>Адрес</th><th>Имя</th><th></th></tr></thead><tbody>${d.static_leases.map((x, i) => `<tr><td class="mono">${esc(x.mac)}</td><td class="mono">${esc(x.address)}</td><td>${esc(x.name)}</td><td><button class="btn sm danger" data-sldel="${i}">Удалить</button></td></tr>`).join("")}</tbody></table></div>` : ""}
      <div class="body row"><input type="text" id="sl-mac" class="mono" placeholder="00:11:22:33:44:55" style="width:170px"><input type="text" id="sl-ip" class="mono" placeholder="${ci ? ipStr(ci.base + 10) : "192.168.1.10"}" style="width:140px"><input type="text" id="sl-name" placeholder="имя" style="width:120px"><button class="btn" id="sl-add">Закрепить</button></div>
      <div class="body" style="border-top:1px solid var(--line);padding-bottom:6px"><b>Выданные адреса</b></div><div class="scroll" id="n-leases">${leasesLive()}</div>` : `<div class="body note">Выключен: устройствам в LAN адреса нужно задавать вручную.</div>`}</div>`;
  const allow = (k, t) => `<label><input type="checkbox" data-allow="${k}" ${f.wan_allow.includes(k) ? "checked" : ""} ${f.enabled ? "" : "disabled"}> ${t}</label>`;
  h += `<div class="card"><h2>Межсетевой экран WAN<span class="spacer"></span>${sw(`data-path="network.firewall.enabled" data-rerender="1"`, f.enabled)}</h2><div class="body">
    ${nft ? "" : `<div class="warnbox">На плате не установлен nftables: межсетевой экран и проброс портов сохранятся в конфигурации, но не будут работать, пока не установить пакет (<span class="mono">apt install nftables</span>).</div>`}
    <p class="note" style="margin-top:0">Включён: с WAN проходят только ответы на соединения из LAN, проброшенные порты и отмеченные службы. Выключен: NAT работает, но вход с WAN не фильтруется.</p>
    <div class="row">Разрешить с WAN: ${allow("ssh", "SSH (22)")} ${allow("web", `веб-интерфейс (${net.web_port})`)} ${allow("ping", "ping")}</div></div></div>`;
  h += `<div class="card"><h2>Проброс портов (WAN → LAN)</h2>
    ${f.port_forwards.length ? `<div class="scroll"><table><thead><tr><th>Имя</th><th>Протокол</th><th class="num">Порт WAN</th><th>Хост LAN</th><th class="num">Порт</th><th></th></tr></thead><tbody>${f.port_forwards.map((x, i) => `<tr><td>${esc(x.name || "—")}</td><td>${x.proto === "both" ? "TCP+UDP" : x.proto.toUpperCase()}</td><td class="num">${x.wan_port}</td><td class="mono">${esc(x.dest)}</td><td class="num">${x.dest_port || x.wan_port}</td><td><button class="btn sm danger" data-pfdel="${i}">Удалить</button></td></tr>`).join("")}</tbody></table></div>` : `<div class="body note">Правил нет. Пример: камера в LAN на 192.168.1.20:554 доступна снаружи по адресу WAN, порт 8554.</div>`}
    <div class="body row" style="border-top:1px solid var(--line)">
      <input type="text" id="pf-name" placeholder="имя" style="width:110px">
      <select id="pf-proto"><option value="tcp">TCP</option><option value="udp">UDP</option><option value="both">TCP+UDP</option></select>
      <input type="number" id="pf-wan" min="1" max="65535" placeholder="порт WAN">
      <span>→</span><input type="text" id="pf-dest" class="mono" placeholder="${ci ? ipStr(ci.base + 20) : "192.168.1.20"}" style="width:140px">
      <input type="number" id="pf-port" min="0" max="65535" placeholder="тот же">
      <button class="btn" id="pf-add">Добавить</button></div></div>`;
  if (!r) h += `</div>`;
  return h;
}
$("#view").addEventListener("click", (e) => {
  const t = e.target;
  if (S.tab !== "net" || !(t.id === "sl-add" || t.id === "pf-add" || t.closest("[data-sldel],[data-pfdel]"))) return;
  const n = takeNet(); if (!n) return;
  if (t.id === "sl-add") {
    const mac = $("#sl-mac").value.trim().toLowerCase().replace(/-/g, ":"), address = $("#sl-ip").value.trim();
    if (!/^([0-9a-f]{2}:){5}[0-9a-f]{2}$/.test(mac)) { toast("MAC в формате 00:11:22:33:44:55", "bad"); return; }
    n.lan.dhcp_server.static_leases.push({ mac, address, name: $("#sl-name").value.trim() }); render(); changed();
  }
  if (t.id === "pf-add") {
    const wp = parseInt($("#pf-wan").value, 10);
    if (!(wp >= 1 && wp <= 65535)) { toast("Порт WAN: 1–65535", "bad"); return; }
    n.firewall.port_forwards.push({ name: $("#pf-name").value.trim(), proto: $("#pf-proto").value, wan_port: wp, dest: $("#pf-dest").value.trim(), dest_port: parseInt($("#pf-port").value, 10) || 0 });
    render(); changed();
  }
  const sd = t.closest("[data-sldel]"); if (sd) { n.lan.dhcp_server.static_leases.splice(+sd.dataset.sldel, 1); render(); changed(); }
  const pd = t.closest("[data-pfdel]"); if (pd) { n.firewall.port_forwards.splice(+pd.dataset.pfdel, 1); render(); changed(); }
});
$("#view").addEventListener("change", (e) => {
  const k = e.target.dataset.allow; if (!k || !takeNet()) return;
  const f = S.draft.network.firewall;
  f.wan_allow = e.target.checked ? [...new Set([...f.wan_allow, k])].sort() : f.wan_allow.filter((x) => x !== k);
  changed();
});

// ---------- system ----------
function sysLive() {
  const s = S.sys; if (!s) return "";
  const cpu = s.cpu_port || {};
  return `<div class="kv">
    <div>Имя хоста</div><div>${esc(s.hostname)}</div>
    <div>Модель</div><div>${esc(s.model)}</div>
    <div>Ядро</div><div class="mono">${esc(s.kernel)}</div>
    <div>Версия napi-switchd</div><div>${esc(s.daemon_version)}</div>
    <div>Время работы</div><div>${fmtUptime(s.uptime_s)}</div>
    <div>Температура</div><div>${(s.temperatures_c || []).map((t) => t.toFixed(1) + " °C").join(", ") || "—"}</div>
    <div>MAC моста</div><div class="mono">${esc(s.bridge_mac)}</div>
    <div>Адреса</div><div>${Object.entries(s.addresses || {}).map(([k, v]) => `${esc(k)}: <span class="mono">${v.map(esc).join(", ")}</span>`).join("<br>") || "—"}</div>
    <div>Канал CPU↔свитч</div><div>${esc(cpu.interface)}: CRC на приёме SoC <b>${fmtNum(cpu.rx_crc_errors)}</b>, CRC на приёме свитча <b>${fmtNum(cpu.switch_rx_crc_errors)}</b>, align <b>${fmtNum(cpu.switch_rx_align_errors)}</b></div>
  </div>`;
}
function viewSystem() {
  const s = S.draft.system;
  return `<div class="grid2"><div class="card"><h2>Идентификация</h2><div class="body"><div class="form">
    <label>Имя устройства</label><div><input type="text" data-path="system.name" value="${esc(s.name)}" style="width:100%"></div>
    <label>Расположение</label><div><input type="text" data-path="system.location" value="${esc(s.location)}" style="width:100%"></div>
    <label>Контакт</label><div><input type="text" data-path="system.contact" value="${esc(s.contact)}" style="width:100%"></div>
  </div></div></div>
  <div class="card"><h2>Устройство</h2><div class="body" id="sys-live">${sysLive()}</div></div></div>`;
}

// ---------- log ----------
function viewLog() {
  const ev = [...(S.events || [])].reverse();
  return `<div class="card"><h2>Журнал изменений</h2>${ev.length ? `<div class="scroll"><table><tbody>${ev.map((e) => `<tr><td class="note">${new Date(e.time).toLocaleString("ru-RU")}</td><td style="white-space:normal">${esc(e.message)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="body note">Событий нет.</div>`}</div>`;
}

// ---------- start ----------
window.addEventListener("beforeunload", (e) => { if (dirty()) { e.preventDefault(); e.returnValue = ""; } });
S.tab = TABS.some(([k]) => k === store.get("napi-tab")) ? store.get("napi-tab") : "ports";
// A link like http://switch:8080/#token=... logs in directly; the fragment
// never reaches the server and is removed from the address bar at once.
const hashTok = new URLSearchParams(location.hash.slice(1)).get("token");
if (hashTok) history.replaceState(null, "", location.pathname);
const saved = hashTok || store.get("napi-token");
if (saved) tryLogin(saved).then((ok) => { if (!ok) showLogin(); }); else showLogin();
</script>
